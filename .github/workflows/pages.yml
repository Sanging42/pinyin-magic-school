# Publish the repository root to GitHub Pages.
# "Deploy from a branch" (build_type legacy) needs administration:write.
# This job asks for that source first, then enables Pages with build_type
# workflow, which the Pages deployment token is allowed to create.
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          request() {
            local method="$1"
            local body="$2"
            local outfile="$3"
            curl -sS -o "${outfile}" -w "%{http_code}" \
              -X "${method}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/pages" \
              -d "${body}"
          }

          legacy='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          code=$(request POST "${legacy}" /tmp/pages-legacy.json)
          echo "POST legacy main / -> ${code}"
          cat /tmp/pages-legacy.json
          echo

          if [ "${code}" = "201" ] || [ "${code}" = "200" ] || [ "${code}" = "409" ]; then
            echo "Pages source is the main branch root."
            exit 0
          fi

          code=$(request POST '{"build_type":"workflow"}' /tmp/pages-workflow.json)
          echo "POST workflow -> ${code}"
          cat /tmp/pages-workflow.json
          echo
          case "${code}" in
            200|201|409) ;;
            *) exit 1 ;;
          esac

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Prefer branch source when the token allows it
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "PUT legacy main / -> ${code}"
          cat /tmp/pages.json
          echo
          gh api "/repos/${REPO}/pages" || true
