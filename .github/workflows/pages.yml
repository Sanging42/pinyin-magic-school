# Deploy the repository root to GitHub Pages.
# Creating a Pages site with source "Deploy from a branch" requires
# administration permission, which this repository token does not have.
# This workflow publishes the same root files (index.html, Build, TemplateData).
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Set branch publishing source when permitted
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d "${payload}")
          echo "PUT /pages -> ${code}"
          cat /tmp/pages.json
          echo
          gh api "/repos/${REPO}/pages" || true
