name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from the main branch root
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d "${payload}")
          echo "POST /pages -> ${code}"
          cat /tmp/pages.json
          echo
          if [ "${code}" = "409" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/pages" \
              -d "${payload}")
            echo "PUT /pages -> ${code}"
            cat /tmp/pages.json
            echo
          fi
          case "${code}" in
            200|201|204) ;;
            *) exit 1 ;;
          esac
          gh api --method POST "/repos/${REPO}/pages/builds" || true
          gh api "/repos/${REPO}/pages"
